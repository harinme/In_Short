spring:
  application:
    name: BE

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:in_short}?sslMode=${MYSQL_SSL_MODE:PREFERRED}
    username: ${MYSQL_USER:hanmadi}
    password: ${MYSQL_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 2s

  management:
    endpoints:
      web:
        exposure:
          include: "*"

    endpoint:
      health:
        show-details: always

      prometheus:
        access: unrestricted

    prometheus:
      metrics:
        export:
          enabled: true

openai:
  api-key: ${OPENAI_API_KEY:dummy-key}

app:
  ai:
    model: ${OPENAI_MODEL:gpt-5.4-mini}
