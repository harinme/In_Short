spring:
  application:
    name: BE

  servlet:
    multipart:
      max-file-size: ${GROQ_STT_MAX_FILE_SIZE:10MB}
      max-request-size: ${GROQ_STT_MAX_REQUEST_SIZE:11MB}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:in_short}?sslMode=${MYSQL_SSL_MODE:PREFERRED}
    username: ${MYSQL_USER:hanmadi}
    password: ${MYSQL_PASSWORD:change-me}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 2s

stt:
  groq:
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_STT_MODEL:whisper-large-v3-turbo}
    language: ${GROQ_STT_LANGUAGE:ko}
    max-file-size: ${GROQ_STT_MAX_FILE_SIZE:10MB}

  management:
    endpoints:
      web:
        exposure:
          include: "*"

    endpoint:
      health:
        show-details: always

      prometheus:
        access: unrestricted

    prometheus:
      metrics:
        export:
          enabled: true
